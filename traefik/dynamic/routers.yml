    dozzle:
      rule: "Host(`dozzle.joetaylor.me`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: dozzle-service
      middlewares:
        - authentik-forward-auth@file

    traefik-dashboard:
      rule: "Host(`traefik.joetaylor.me`)"
      service: api@internal
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - authentik-forward-auth@file

    http-catchall:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: noop-service

    catchall-router:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      middlewares:
        - authentik-forward-auth@file
      service: noop-service

    n8n:
      rule: "Host(`n8n.joetaylor.me`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: n8n-service
