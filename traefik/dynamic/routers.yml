# traefik/dynamic/routers.yml

http:
  routers:
    authentik:
      rule: "Host(`authentik.joetaylor.me`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: authentik-service

    netdata:
      rule: "Host(`netdata.joetaylor.me`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: netdata-service
      middlewares:
        - authentik-forward-auth@file

    pihole:
      rule: "Host(`pihole.joetaylor.me`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: pihole-service
      middlewares:
        - authentik-forward-auth@file

    portainer:
      rule: "Host(`portainer.joetaylor.me`)"
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
      service: portainer-service
      middlewares:
        - authentik-forward-auth@file

    # uptime-kuma:
    #   rule: "Host(`uptime.joetaylor.me`)"
